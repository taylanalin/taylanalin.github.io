<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Özel Erişim</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #081321;
        --panel: #0f1f33;
        --gold: #e3bd63;
        --text: #f5f7fb;
        --muted: #aab6c6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 40% 20%, rgba(227, 189, 99, 0.16), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(560px, calc(100% - 32px));
        border: 1px solid rgba(227, 189, 99, 0.35);
        border-radius: 8px;
        background: rgba(15, 31, 51, 0.86);
        padding: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BTGM Yöneticilik Akademisi</h1>
      <p>Bu okuma alanı özel erişimli yayına taşınmıştır. Arama motorlarının bu sayfayı indekslememesi istenmiştir.</p>
    </main>
  </body>
</html>
